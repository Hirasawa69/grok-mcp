[package]
name = "grok-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
log = "0.4.29"
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "020a38b6ad3d0f26487c464250a484fad2a06b0e", features = ["macros"] }
schemars = "1.2.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
