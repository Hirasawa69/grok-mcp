[package]
name = "grok-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server bridging local agents to grok.com via cookie auth."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hirasawa69/grok-mcp"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bon = "3.9.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
futures-util = "0.3.32"
rand = "0.10.1"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["cookies", "gzip", "json", "rustls", "stream"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "020a38b6ad3d0f26487c464250a484fad2a06b0e", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = { version = "1.2.1", features = ["chrono04"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_with = "3.18.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.52.1", features = ["fs", "io-std", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["test-util"] }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
